version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile-backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://hruser:hypass@db/hrflow
      - SECRET_KEY=your-super-secret-key
      - JWT_SECRET_KEY=your-jwt-secret-key
      - MAIL_SERVER=smtp.qq.com
      - MAIL_USERNAME=your_email@qq.com
      - MAIL_PASSWORD=your_auth_code
      - MAIL_FROM=HR System <your_email@qq.com>
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: hruser
      POSTGRES_PASSWORD: hypass
      POSTGRES_DB: hrflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: